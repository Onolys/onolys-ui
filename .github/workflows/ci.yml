name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  tests:
    name: Unit, contrast, privacy, geometry and CSP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      # Package/compiler and consumer fixtures have dedicated jobs below.
      - name: Run the remaining Vitest suite once
        run: npm test -- --exclude src/package.test.ts --exclude src/consumer-fixtures.test.ts --maxWorkers=2

  package-types:
    name: Package build and TypeScript 6/7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify packed exports, watch builds and TypeScript 6/7
        run: npm test -- src/package.test.ts --maxWorkers=1

  consumers:
    name: Packed Vite/Astro and CSP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify independent packed consumers under strict CSP
        run: npm test -- src/consumer-fixtures.test.ts --maxWorkers=1

  storybook:
    name: Storybook build and axe in light/dark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build and audit the component catalogue
        run: npm run test:storybook
      - name: Prove the axe gate rejects an isolated violation
        run: npm run test:storybook:negative

  auth-emulator:
    name: Auth emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      # Tasks 4-5 add *.emulator.test.ts files; until then the run passes with no tests.
      - name: Run auth tests under the Auth emulator
        run: firebase emulators:exec --config firebase.json --only auth --project demo-onolys 'npm run test:auth'

name: Release

on:
  push:
    tags: ["release/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate the source trigger and release notes
        env:
          RELEASE_TRIGGER: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: node scripts/release.mjs validate --trigger "$RELEASE_TRIGGER" --source "$RELEASE_SOURCE"
      - run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build a detached release commit and bundle
        id: release
        env:
          RELEASE_TRIGGER: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_OUTPUT: ${{ runner.temp }}/onolys-ui-release
        run: node scripts/release.mjs build --trigger "$RELEASE_TRIGGER" --source "$RELEASE_SOURCE" --output "$RELEASE_OUTPUT" --github-output "$GITHUB_OUTPUT"
      - name: Install the release from a disposable local git remote
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/onolys-ui-release
          RELEASE_TEST_REMOTE: ${{ runner.temp }}/onolys-ui-release.git
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          git clone --bare "$RELEASE_OUTPUT/release.bundle" "$RELEASE_TEST_REMOTE"
          git -C "$RELEASE_TEST_REMOTE" update-ref refs/heads/main "$RELEASE_SOURCE"
          git -C "$RELEASE_TEST_REMOTE" symbolic-ref HEAD refs/heads/main
          node scripts/release-smoke.mjs --spec "git+file://${RELEASE_TEST_REMOTE}#${RELEASE_TAG}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/onolys-ui-release/release.bundle
            ${{ runner.temp }}/onolys-ui-release/release.json
            ${{ runner.temp }}/onolys-ui-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/onolys-ui-release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          token: ""
      # Publisher code comes from the exact source checkout; downloaded artifacts are data only.
      - name: Create the immutable install tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/onolys-ui-release
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_TRIGGER: ${{ github.ref_name }}
        run: node scripts/release.mjs publish --directory "$RELEASE_DIRECTORY" --repository "$GITHUB_REPOSITORY" --source "$RELEASE_SOURCE" --trigger "$RELEASE_TRIGGER"

  consumer:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify an unauthenticated github install over HTTPS
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: node scripts/release-smoke.mjs --spec "github:Onolys/onolys-ui#${RELEASE_TAG}"
